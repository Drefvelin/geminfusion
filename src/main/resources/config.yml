infusion_blocks:
    - enchanting_table
location_specific: false
locations:
    - -2590,134,-5321

infusion_item: loot.infusion_token

# Intelligence nudges the rolled gem stat (not rarity odds). 0.2 = 20% of the rolled value.
attribute-influence:
  mmocore-id: intelligence
  floor: 0
  neutral: 10
  full: 20
  max-bonus: 0.2
  max-penalty: 0.2

# Dexterity nudges the jewelry stat copied from the consumed gem. Independent of infusion Intelligence.
jewelry-attribute-influence:
  mmocore-id: dexterity
  floor: 0
  neutral: 10
  full: 20
  max-bonus: 0.2
  max-penalty: 0.2

